<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>STYLE MARKET</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#09090c;--cd:#17171d;--c2:#22222b;--tx:#f4f4f6;--mu:#8d8d99;--gr:#2fd66b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,Roboto,sans-serif;overflow:hidden}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#3b82f6);display:grid;place-items:center;font-weight:800}
.xp{flex:1}.xp i{display:block;height:6px;border-radius:3px;background:#2a2a33;margin-top:5px;overflow:hidden}.xp i b{display:block;height:100%;background:var(--gr)}
.bal{text-align:right;font-weight:800;font-size:17px}.bal small{display:block;color:var(--mu);font-weight:400;font-size:11px}
#m{height:calc(100% - 66px - 80px - env(safe-area-inset-bottom,0px));overflow:auto;padding:0 14px 20px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#14141a;border-radius:24px;display:flex;padding:6px;box-shadow:0 6px 24px #000}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0;border-radius:18px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:#262630;color:var(--gr)}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cd{background:var(--cd);border-radius:18px;padding:14px;margin-bottom:10px}
.ban{background:linear-gradient(135deg,#3a2a05,#1a1206);border:1px solid #6b4d10;border-radius:16px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button.b{background:var(--gr);color:#04140a;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:16px;width:100%}
button.s{background:var(--c2);color:var(--tx);border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
button.b:disabled,button.s:disabled{opacity:.4}
.ch{display:flex;gap:6px;overflow:auto;padding-bottom:8px;margin-bottom:4px}.ch button{flex:none;background:var(--c2);color:var(--tx);border:0;border-radius:20px;padding:8px 13px;font-size:13px}.ch button.on{background:#fff;color:#000}
input{width:100%;background:var(--cd);border:0;border-radius:14px;padding:12px 14px;color:var(--tx);font-size:16px;margin-bottom:8px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ic{background:var(--cd);border:1px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 22%,#17171d),#17171d 65%);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);border-radius:18px;padding:10px;position:relative;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 18%,transparent)}
.ic.m5{animation:gl 2s infinite alternate}@keyframes gl{to{box-shadow:0 0 26px var(--rc)}}
.im{aspect-ratio:1;display:block}.im svg{width:100%;height:100%}
.ic b{display:block;font-size:13px;line-height:1.2}.ic small{color:var(--mu);font-size:11px}
.rt{font-size:11px;font-weight:700;color:var(--rc)}.pr{font-weight:800;margin-top:4px}
.ic.sel{outline:3px solid var(--gr)}
.rw{display:flex;align-items:center;gap:10px;background:var(--cd);border-radius:16px;padding:8px;margin-bottom:8px;position:relative;border-left:4px solid var(--rc)}
.rw .im{width:60px;flex:none}.rw div.t{flex:1;min-width:0}.rw b{font-size:14px;display:block}
.box{height:170px;display:grid;place-items:center;margin:6px 0;position:relative}
.cr{position:relative;width:120px;height:110px;animation:fl 2.2s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-6px)}}
.cr u{display:block;position:absolute;text-decoration:none}
.bd{background:var(--bc);bottom:0;left:0;width:120px;height:72px;border-radius:10px 10px 16px 16px;background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 70%,#fff),color-mix(in srgb,var(--bc) 40%,#000));box-shadow:0 0 36px color-mix(in srgb,var(--bc) 55%,transparent)}
.bd:after{content:"";position:absolute;left:50%;top:0;width:18px;height:100%;margin-left:-9px;background:#0003}
.lid{background:var(--bc);top:8px;left:-6px;width:132px;height:36px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 85%,#fff),color-mix(in srgb,var(--bc) 50%,#000));transform-origin:left bottom;z-index:2}
.gl{left:10px;right:10px;top:34px;height:20px;border-radius:50%;background:#fff;filter:blur(14px);opacity:0}
.rays{background:repeating-conic-gradient(var(--bc) 0 8deg,transparent 8deg 24deg);left:50%;top:44px;width:260px;height:260px;margin:-130px 0 0 -130px;background:repeating-conic-gradient(color-mix(in srgb,var(--bc) 80%,#fff) 0 8deg,transparent 8deg 24deg);border-radius:50%;opacity:0;-webkit-mask:radial-gradient(circle,#000 5%,transparent 68%);mask:radial-gradient(circle,#000 5%,transparent 68%)}
.box.go .cr{animation:shk .7s}
.box.go .lid{animation:lid 1.2s .7s forwards}
.box.go .gl{animation:glw 1.2s .7s forwards}
.box.go .rays{animation:ry 1.2s .7s forwards}
@keyframes shk{0%,100%{transform:none}15%{transform:translateX(-8px) rotate(-4deg)}30%{transform:translateX(8px) rotate(4deg)}45%{transform:translateX(-10px) rotate(-5deg)}60%{transform:translateX(10px) rotate(5deg)}80%{transform:translateX(-6px)}}
@keyframes lid{to{transform:translateY(-80px) rotate(-38deg);opacity:0}}
@keyframes glw{0%{opacity:0}30%{opacity:1}100%{opacity:.9;transform:scale(2.5,6)}}
@keyframes ry{0%{opacity:0;transform:scale(.3)}40%{opacity:.95}100%{opacity:0;transform:scale(1.4) rotate(40deg)}}
.box i{width:110px;height:110px;border-radius:26px;background:linear-gradient(135deg,#f5b301,#ff7a1a);box-shadow:0 0 40px #f5b30160;display:grid;place-items:center;font-style:normal;font-size:44px;font-weight:900;color:#3a2200}
.box.go i{animation:sh .7s}@keyframes sh{20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg) scale(1.15)}60%{transform:rotate(-10deg) scale(1.2)}100%{transform:scale(.8);opacity:.3}}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}#ov.on{display:flex}
.sh{background:#141419;width:100%;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s}@keyframes up{from{transform:translateY(60%)}}
.pop{animation:pp .5s both}@keyframes pp{from{transform:scale(.4);opacity:0}}
h3{margin:14px 2px 8px;font-size:12px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;display:none;max-width:90%;pointer-events:none}
.pb{height:8px;border-radius:4px;background:#2a2a33;overflow:hidden}.pb b{display:block;height:100%;background:var(--gr)}
</style></head><body>
<div id="top"></div><div id="m"></div>
<nav id="nv"></nav><div id="ov"><div class="sh" id="sh"></div></div><div id="ts"></div>
<script>
const R=[["Обычный","#9aa0a6",55],["Необычный","#34c759",25],["Редкий","#3b82f6",12],["Эпический","#a855f7",5.5],["Легендарный","#f5b301",2],["Мифический","#ff3b5c",.5]];
const CT={sneaker:"Кроссовки",hoodie:"Худи",tee:"Футболки",jacket:"Куртки",jeans:"Джинсы",bag:"Сумки",cap:"Кепки",watch:"Часы"};
// name, brand, cat, rarity, base price, c1, c2, c3, variant
const I=[
["Basic Tee","NVRST","tee",0,1500,"#cfd3d8","#8e949c","#222",0],
["Daily Cap","DRIPZONE","cap",0,1800,"#ff9f43","#d35400","#2b1a0a",0],
["Straight Jeans","BLVCKFORM","jeans",0,3200,"#3d5a80","#1e2f4a","#d8c9a0",0],
["Street Low","NVRST","sneaker",0,5500,"#e8e8ea","#9a9aa3","#2a2a2a",0],
["Cloud Hoodie","DRIPZONE","hoodie",1,6500,"#7ec8e3","#3b82a8","#1a3a4a",0],
["Track Jacket","AERONIX","jacket",1,8500,"#2ecc71","#117a3e","#0b2f19",0],
["Trail Pack","NORTHLINE","bag",1,7000,"#c2813b","#7a4a18","#2b1b0a",0],
["Graphic Tee","DRIPZONE","tee",1,3800,"#f1c40f","#b7950b","#d63031",1],
["Pulse Runner","AERONIX","sneaker",2,14000,"#3b82f6","#1d4ed8","#f4f4f6",1],
["Raw Denim","BLVCKFORM","jeans",2,12000,"#1b1f2b","#0b0d14","#8a8f9c",1],
["Storm Parka","NORTHLINE","jacket",2,24000,"#e67e22","#a04000","#2b1400",1],
["Apex Runner","VELTRIX","sneaker",3,29000,"#a855f7","#6d28d9","#17082e",2],
["Studio Tote","MONTEVO","bag",3,38000,"#111","#333","#d4af37",0],
["Noir Coat","MONTEVO","jacket",4,120000,"#15151a","#050507","#d4af37",1],
["Chrono Gold","MONTEVO","watch",4,180000,"#f5d061","#b8860b","#d4af37",0],
["Genesis 1","RARESTEP","sneaker",5,480000,"#ff3b5c","#7a0a22","#ffd166",2],
["Core Hoodie","BLVCKFORM","hoodie",2,13000,"#2b2b31","#101014","#8d8d99",1],
["Logo Cap","NVRST","cap",1,2900,"#e11d48","#7f1d1d","#fff",1]];
const S_={
sneaker:(g,a,b,d,v)=>`<path d="M24 138Q22 98 52 94L80 88Q96 66 118 78L138 100Q176 104 186 130L186 150H26Z" fill="url(#${g})"/><rect x="20" y="146" width="170" height="16" rx="8" fill="${d}"/><path d="M88 90L112 104M96 82L120 96M80 98L104 112" stroke="${d}" stroke-width="4" stroke-linecap="round"/><path d="M40 134Q90 ${112+v*8} 170 128" stroke="#fff" stroke-opacity=".75" stroke-width="${4+v*2}" fill="none" stroke-linecap="round"/><path d="M140 104Q165 108 180 126" stroke="#fff" stroke-opacity=".3" stroke-width="3" fill="none"/>`,
hoodie:(g,a,b,d,v)=>`<path d="M70 50Q100 70 130 50L170 70L190 140L162 148L152 110V170H48V110L38 148L10 140L30 70Z" fill="url(#${g})"/><path d="M70 50Q100 14 130 50Q100 80 70 50Z" fill="${b}"/><path d="M82 112H118L126 148H74Z" fill="#000" opacity=".22"/><path d="M92 66V92M108 66V92" stroke="${d}" stroke-width="3" stroke-linecap="round"/>${v?`<rect x="70" y="96" width="60" height="6" fill="${d}" opacity=".7"/>`:""}`,
tee:(g,a,b,d,v)=>`<path d="M70 38Q100 56 130 38L174 58L190 96L158 106L150 92V164H50V92L42 106L10 96L26 58Z" fill="url(#${g})"/><path d="M70 38Q100 56 130 38" stroke="${b}" stroke-width="6" fill="none"/>${v?`<rect x="76" y="86" width="48" height="30" rx="4" fill="${d}"/>`:`<circle cx="100" cy="100" r="16" fill="${d}" opacity=".8"/>`}`,
jacket:(g,a,b,d,v)=>`<path d="M64 36L100 50L136 36L176 60L190 150L160 156L154 100V168H46V100L40 156L10 150L24 60Z" fill="url(#${g})"/><path d="M100 50V168" stroke="${d}" stroke-width="4"/><path d="M64 36L100 82L136 36L120 30L100 50L80 30Z" fill="${b}"/><rect x="58" y="126" width="28" height="6" rx="3" fill="${d}"/><rect x="114" y="126" width="28" height="6" rx="3" fill="${d}"/>${v?`<path d="M20 90L34 88M180 90L166 88" stroke="${d}" stroke-width="5"/>`:""}`,
jeans:(g,a,b,d,v)=>`<path d="M56 22H144L156 170H108L100 70L92 170H44Z" fill="url(#${g})"/><path d="M56 22H144V38H56Z" fill="${b}"/><path d="M100 38V70M70 54H88M112 54H130" stroke="${d}" stroke-width="3" fill="none"/>${v?`<path d="M62 120H92M110 120H140" stroke="${d}" stroke-width="3"/>`:""}`,
bag:(g,a,b,d,v)=>`<path d="M70 70V50Q70 22 100 22Q130 22 130 50V70" stroke="${d}" stroke-width="8" fill="none"/><rect x="38" y="68" width="124" height="100" rx="14" fill="url(#${g})"/><rect x="38" y="68" width="124" height="32" rx="14" fill="${b}"/><circle cx="100" cy="116" r="8" fill="${d}"/>`,
cap:(g,a,b,d,v)=>`<path d="M30 124Q30 52 100 52Q170 52 170 124Z" fill="url(#${g})"/><path d="M110 120Q190 112 196 134Q150 142 110 130Z" fill="${b}"/><circle cx="100" cy="50" r="6" fill="${d}"/><path d="M100 56V122M70 64Q62 92 66 124M130 64Q138 92 134 124" stroke="${d}" stroke-width="2" opacity=".5" fill="none"/>${v?`<rect x="84" y="86" width="32" height="14" rx="3" fill="${d}"/>`:""}`,
watch:(g,a,b,d)=>`<rect x="82" y="8" width="36" height="184" rx="12" fill="${b}"/><circle cx="100" cy="100" r="50" fill="url(#${g})" stroke="${d}" stroke-width="6"/><circle cx="100" cy="100" r="37" fill="#0c0c10"/><path d="M100 100V74M100 100L118 110" stroke="#fff" stroke-width="4" stroke-linecap="round"/>${[0,1,2,3].map(k=>`<circle cx="${100+30*Math.sin(k*1.5708)}" cy="${100-30*Math.cos(k*1.5708)}" r="2.5" fill="${a}"/>`).join("")}`};
const art=i=>{const [,,c,,,a,b,d,v]=I[i],g="g"+i;return `<svg viewBox="0 0 200 200"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><ellipse cx="100" cy="178" rx="70" ry="8" fill="#000" opacity=".4"/>${S_[c](g,a,b,d,v)}</svg>`};
const $=s=>document.querySelector(s),fm=n=>Math.round(n).toLocaleString("ru-RU")+" ₽",CO=()=>boxCost(),fk=n=>n?Math.round(n/100)/10+"к":"—";
// Telegram (без внешнего SDK: берём то, что инжектит клиент)
const tg=window.Telegram&&window.Telegram.WebApp;let uid="local";
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#09090c");tg.setBackgroundColor&&tg.setBackgroundColor("#09090c");if(tg.initDataUnsafe&&tg.initDataUnsafe.user)uid=String(tg.initDataUnsafe.user.id)}
else{const d=new URLSearchParams(location.hash.slice(1)).get("tgWebAppData");if(d){const u=JSON.parse(new URLSearchParams(d).get("user"));uid=String(u.id)}}}catch(e){}
const K="sm_"+uid,today=new Date().toDateString();let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={bal:50000,xp:0,inv:[],opened:0,sold:0,bought:0,free:5,fd:today,daily:"",t:{o:0,s:0,b:0,c:{}},h:[],mk:null,bot:""};
if(S.fd!==today){S.free=5;S.fd=today;S.t={o:0,s:0,b:0,c:{}}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const rnd=()=>Math.floor(Math.random()*1e9).toString(36)+Date.now().toString(36);
const log=(m,d)=>{S.h.unshift({t:Date.now(),m,d});S.h=S.h.slice(0,60)};
const toast=m=>{const t=$("#ts");t.textContent=m;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display="none",2200)};
let tab="play",P={cat:"all",min:0,n:1,busy:false,last:null},W={sort:"p",q:"",v:"g",sel:null},M={q:"",cat:"all",sort:"n",seg:"v"};
const lv=()=>Math.floor(S.xp/200)+1;
const val=u=>S.inv.reduce((a,x)=>a+x.val,0);
function mkList(){S.mk=[];for(let k=0;k<12;k++){const i=Math.floor(Math.random()*I.length);S.mk.push({id:rnd(),i,p:Math.round(I[i][4]*(.95+Math.random()*.4)/10)*10,n:k})}save()}
if(!S.mk)mkList();
let AF="all",AV=null,AD=5;
const BN=["Vlad","Mira","Kenji","Dasha","Alex","Nika"],step=c=>Math.max(100,Math.round(c*.05/10)*10),minBid=a=>a.bids.length?a.cur+step(a.cur):a.start;
const tl=e=>{const s=Math.max(0,Math.round((e-Date.now())/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" ч "+m+" мин":m+":"+String(s%60).padStart(2,"0")};
function tp(){$("#top").innerHTML=`<div class="av">${lv()}</div><div class="xp"><b>Ур. ${lv()}</b><i><b style="width:${S.xp%200/2}%"></b></i></div><div class="bal"><small>Баланс</small>${fm(S.bal)}</div><button class="s" aria-label="Настройки" onclick="A.set()" style="padding:9px 11px">⚙</button>`}
function newAu(){const i=Math.floor(Math.random()*I.length),b=I[i][4],now=Date.now();return {id:rnd(),i,val:Math.round(b*(.9+Math.random()*.25)/10)*10,own:false,start:Math.round(b*.6/10)*10,cur:Math.round(b*.6/10)*10,lead:"",bids:[],end:now+(3+Math.random()*22)*6e4,nb:now+(5+Math.random()*25)*1e3,mx:Math.round(b*(1.05+Math.random()*.5)/10)*10,done:false}}
if(!S.au){S.au=[];for(let k=0;k<6;k++)S.au.push(newAu())}
function settle(){const now=Date.now();let ch=false;
S.au.forEach(a=>{if(a.done)return;
while(a.nb<=Math.min(now,a.end)){const mb=minBid(a);
if(mb<=a.mx&&(a.lead!="me"||Math.random()<.85)&&(!a.lead||a.lead=="me"||Math.random()<.5)){const w=BN[Math.floor(Math.random()*BN.length)];
if(a.lead=="me"){S.bal+=a.cur;log("Ставка перебита: "+I[a.i][1]+" "+I[a.i][0],a.cur);toast("Вашу ставку перебили")}
a.cur=mb;a.lead=w;a.bids.push({w,p:mb,t:a.nb});if(a.end-a.nb<2e4)a.end=a.nb+2e4;ch=true}
a.nb+=(6+Math.random()*30)*1e3}
if(now>=a.end){a.done=true;ch=true;const n=I[a.i][1]+" "+I[a.i][0];
if(a.own){if(a.bids.length){const g=Math.round(a.cur*.9);S.bal+=g;S.sold++;S.t.s++;S.xp+=15;log("Аукцион: продано "+n,g);toast("Лот продан: +"+fm(g))}
else{S.inv.push({uid:a.uid,i:a.i,val:a.val,t:now});log("Аукцион без ставок: "+n,0);toast("Лот вернулся в гардероб")}}
else if(a.lead=="me"){S.inv.push({uid:rnd(),i:a.i,val:a.val,t:now});S.bought++;S.t.b++;S.xp+=25;log("Выиграно на аукционе: "+n,0);toast("Вы выиграли: "+n)}}});
if(S.au.filter(a=>!a.done&&!a.own).length<5){S.au.push(newAu());ch=true}
if(S.au.length>40)S.au=S.au.filter(a=>!a.done||a.own||a.bids.some(b=>b.w=="me"));
return ch}
settle();save();
function alist(){let l=S.au.filter(a=>AF=="all"?!a.done:(a.own||a.bids.some(b=>b.w=="me")));l.sort((a,b)=>a.done-b.done||a.end-b.end);
return l.length?l.map(a=>{const it=I[a.i],r=it[3];return `<div class="rw" style="--rc:${R[r][1]}" onclick="A.aopen('${a.id}')"><span class="im">${art(a.i)}</span><div class="t"><b>${it[1]} ${it[0]}</b><span class="rt">${R[r][0]}</span>${a.own?' <span class="mu">· ваш лот</span>':""}<div class="pr">${fm(a.cur)}</div><div class="mu">${a.done?"Завершён":`<span data-e="${a.end}">${tl(a.end)}</span>`} · ставок: ${a.bids.length}${a.lead=="me"?" · <b style='color:var(--gr)'>вы лидер</b>":""}</div></div><button class="s">${a.own||a.done?"Открыть":"Ставка"}</button></div>`}).join(""):`<p class="mu" style="text-align:center;padding:30px 0">${AF=="all"?"Активных торгов нет.":"У вас пока нет ставок и лотов."}</p>`}
function aucView(){return `<div class="ch"><button class="${AF=="all"?"on":""}" onclick="AF='all';render()">Активные</button><button class="${AF=="mine"?"on":""}" onclick="AF='mine';render()">Мои ставки и лоты</button></div><div id="lst">${alist()}</div>`}
